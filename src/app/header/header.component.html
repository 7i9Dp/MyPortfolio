<header class="nav" [class.scrolled]="scrolled">
  <div class="container nav-inner">
    <a href="#home" class="logo" (click)="go($event, 'home')" [attr.aria-label]="brand.name + ' — back to top'">
      <img class="logo-mark" [src]="brand.mark" width="186" height="126" alt="">
      <span class="logo-text">
        <span class="wordmark"><span class="w-growth">growth</span><span class="w-forge">forge</span><span class="w-dev">dev</span></span>
        <span class="logo-sub">by {{ founder }}</span>
      </span>
    </a>

    <nav id="primary-nav" class="links" [class.open]="menuOpen" aria-label="Primary">
      <a *ngFor="let item of navItems"
         [href]="'#' + item.id"
         [class.active]="activeId === item.id"
         [attr.aria-current]="activeId === item.id ? 'true' : null"
         (click)="go($event, item.id)">{{ item.label }}</a>
      <a href="#contact" class="btn btn-primary btn-sm mobile-cta" (click)="go($event, 'contact')">Let's Connect</a>
    </nav>

    <a href="#contact" class="btn btn-primary btn-sm desktop-cta" (click)="go($event, 'contact')">Let's Connect</a>

    <button class="burger" type="button" [class.open]="menuOpen" (click)="toggleMenu()"
            [attr.aria-expanded]="menuOpen" aria-controls="primary-nav"
            [attr.aria-label]="menuOpen ? 'Close menu' : 'Open menu'">
      <span></span><span></span><span></span>
    </button>
  </div>
  <div class="backdrop" *ngIf="menuOpen" (click)="closeMenu()"></div>
</header>
