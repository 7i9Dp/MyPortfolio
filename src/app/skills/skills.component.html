<section class="section skills" id="skills" aria-labelledby="skills-title">
  <div class="container">
    <header class="section-head" appReveal>
      <span class="eyebrow">// What I work with</span>
      <h2 id="skills-title" class="section-title">My Skills &amp; <span class="accent">Expertise</span></h2>
      <p class="section-sub">Technologies I use to design, build and ship production software</p>
      <div class="divider"></div>
    </header>

    <div class="skill-grid">
      <article *ngFor="let group of groups; let i = index" class="skill-card"
               [attr.data-accent]="group.accent" appReveal [revealDelay]="i * 80">
        <div class="card-head">
          <span class="card-icon"><i class="bx" [ngClass]="group.icon" aria-hidden="true"></i></span>
          <h3>{{ group.title }}</h3>
        </div>
        <ul>
          <li *ngFor="let skill of group.items">
            <i class="bx bx-check" aria-hidden="true"></i>{{ skill }}
          </li>
        </ul>
      </article>
    </div>
  </div>
</section>
